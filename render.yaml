services:
  # NIRAZ Web Service
  - type: web
    name: niraz-fashion-store
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn niraz_project.wsgi --log-file -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: niraz-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

databases:
  # Relational PostgreSQL Database Engine
  - name: niraz-db
    plan: free
    databaseName: niraz_db
    user: niraz_owner
